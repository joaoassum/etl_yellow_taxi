[project]
name = "etl-yellow-taxi"
version = "0.1.0"
description = "ETL Yellow Taxi"
readme = "README.md"
authors = [
    { name = "João Pedro", email = "joaoassum.jp@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
]

[project.scripts]
etl-yellow-taxi = "etl_yellow_taxi:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"